name: inspect
version: 20261026001
description: |
  Read-only verification audit against agreed behavior, including missing work
  and evidence gaps. Use for "inspect", "assess", or "check without fixing".
  Report findings without code edits, commits, or mandatory duplicate reports.
allowed-tools: 'execute read search'
argument-hint: '[component or service to inspect]'

license: MIT
compatibility: Requires a skills-compatible agent with repository file access and terminal command execution when needed.
metadata:
  owner: vstack
  maturity: stable
user-invocable: true
disable-model-invocation: false
