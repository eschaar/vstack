name: changedoc
version: 20261026001
description: |
  Maintain one change-local specification when durable scope or handoff is needed.
  Capture requirements, acceptance, useful tasks, and evidence without duplicate
  documents. Clear low-risk work may use existing issue or conversation context.
allowed-tools: 'execute read search edit'
argument-hint: '[change request, ticket reference, and scope]'

license: MIT
compatibility: Requires a skills-compatible agent with repository file access.
metadata:
  owner: vstack
  maturity: stable
user-invocable: true
disable-model-invocation: false
