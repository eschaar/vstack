name: verify
version: 20261026001
description: |
  Verify agreed behavior in quick/standard/exhaustive mode, fix authorized gaps,
  and rerun affected checks. Use for "verify", "fix failing checks", or "run QA
  with fixes". Route report-only work to inspect; stop on blockers or no progress.
allowed-tools: 'execute read search edit'
argument-hint: '[component or feature to verify]'

license: MIT
compatibility: Requires a skills-compatible agent with repository file access and terminal command execution when needed.
metadata:
  owner: vstack
  maturity: stable
user-invocable: true
disable-model-invocation: false
