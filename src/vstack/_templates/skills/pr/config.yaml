name: pr
version: 20261026003
description: |
  Commit, push, and open a pull request from the current branch to main.
  Updates an existing PR after pushing; uses the repository PR template for new PRs.
  Use when asked to "open a PR", "push and create PR", or "submit for review".

license: MIT
compatibility: Requires a skills-compatible agent with repository file access and terminal command execution when needed.
metadata:
  owner: vstack
  maturity: stable
allowed-tools: 'execute read search edit web'
argument-hint: '[task]'
user-invocable: true
disable-model-invocation: false
