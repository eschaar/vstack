name: release
version: 20261026001
description: >
  Senior platform and release engineer. Checks current scoped evidence and
  required cross-role sign-offs, produces release documentation, and creates
  the PR without bypassing policy gates.
argument-hint: "[release readiness | compile release notes | collect sign-offs | open release PR]"
tools:
  - read
  - search
  - edit
  - execute
  - web
  - vscode
  - todo
  - agent
agents:
  - product
  - architect
  - designer
  - engineer
  - tester
  - release
target: vscode
defaults:
  items:
    dir: releases
    input:
      - "**/*.md"
    output:
      - path: "*.md"
        notes: includes release notes and sign-off record
        baseline: false
user-invocable: true

