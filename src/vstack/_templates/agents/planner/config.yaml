name: planner
version: 20261026001
description: >
  vstack coordinator. Routes focused work to its owner or orchestrates configured
  stage dependencies, gates, and approvals. Reports progress without doing role work.
argument-hint: "[run workflow | orchestrate stages | gate progression | coordinator mode]"
tools:
  - read
  - search
  - todo
  - agent
agents:
  - product
  - architect
  - designer
  - engineer
  - tester
  - release
target: vscode
defaults:
  items:
    input:
      - "**/*.md"
user-invocable: true
