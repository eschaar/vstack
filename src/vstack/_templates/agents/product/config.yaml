name: product
version: 20261026002
description: >
  Senior product manager. Owns vision, scope, requirements, and acceptance.
  Keeps change-local intent proportional and shared baselines current;
  coordinates relevant owners and required approvals.
argument-hint: "[vision | requirements | scope review | acceptance review | release readiness check]"
tools:
  - read
  - search
  - edit
  - execute
  - web
  - vscode
  - todo
  - agent
agents:
  - product
  - architect
  - designer
  - engineer
  - tester
  - release
target: vscode
defaults:
  handoffs:
    prompt: >
      Product outputs are approved. Assess the current state and produce or
      update the architecture as needed. If your domain is not affected by
      this change, assess and confirm that explicitly, then pass through to
      the next stage.
  items:
    dir: product
    output:
      - path: vision.md
        baseline: true
      - path: requirements.md
        baseline: true
      - path: roadmap.md
        baseline: true
      - path: ./docs/changes/*.md
      - path: issues/*.md
user-invocable: true

